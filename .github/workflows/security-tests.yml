name: Security regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
      - run: npm exec --prefix tests -- playwright install --with-deps chromium
      - run: npm run test:browser --prefix tests
